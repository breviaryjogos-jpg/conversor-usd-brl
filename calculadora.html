<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071329">
  <meta name="description" content="Calculadora BREVIARY MOBILE para operações do dia a dia.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <title>Calculadora · BREVIARY MOBILE</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #071329;
      --panel: rgba(10, 23, 45, .94);
      --line: rgba(145, 196, 232, .16);
      --text: #f6f9ff;
      --muted: #9caec4;
      --blue: #32c9ff;
      --orange: #ff9b27;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); }
    body {
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      place-items: center;
      margin: 0;
      padding: 22px 16px calc(22px + env(safe-area-inset-bottom));
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(ellipse at 0% 15%, rgba(255, 86, 25, .22), transparent 38%), radial-gradient(ellipse at 100% 90%, rgba(0, 113, 255, .24), transparent 40%), var(--bg);
    }
    .app { width: min(100%, 430px); }
    .back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 13px 4px;
      color: #8bdfff;
      font-size: 13px;
      font-weight: 650;
      text-decoration: none;
    }
    .back:hover { color: #fff; }
    .back span { font-size: 19px; line-height: 1; }
    .offline::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #56d8a5;
      box-shadow: 0 0 9px rgba(86, 216, 165, .7);
      content: "";
    }
    .card {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 25px;
      background: linear-gradient(155deg, rgba(15, 32, 57, .97), rgba(5, 16, 34, .98));
      box-shadow: 0 24px 70px rgba(0, 0, 0, .42), inset 0 1px rgba(255, 255, 255, .045);
    }
    .display {
      display: flex;
      min-height: 145px;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-end;
      padding: 19px 17px;
      overflow: hidden;
      border: 1px solid rgba(114, 174, 217, .17);
      border-radius: 19px;
      background: linear-gradient(135deg, rgba(2, 10, 24, .85), rgba(7, 25, 48, .94));
      box-shadow: inset 0 2px 18px rgba(0, 0, 0, .24);
    }
    .expression {
      min-height: 21px;
      max-width: 100%;
      overflow: hidden;
      color: var(--muted);
      font-size: 14px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .value {
      width: 100%;
      margin-top: 7px;
      overflow: hidden;
      color: #fff;
      font-size: clamp(38px, 11vw, 54px);
      font-weight: 650;
      letter-spacing: -.045em;
      line-height: 1.12;
      text-align: right;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .keys {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-top: 16px;
    }
    .key {
      min-width: 0;
      min-height: clamp(58px, 15vw, 68px);
      border: 1px solid rgba(130, 173, 212, .13);
      border-radius: 18px;
      color: #eef6ff;
      background: linear-gradient(145deg, rgba(34, 52, 77, .94), rgba(18, 32, 53, .98));
      box-shadow: 0 5px 12px rgba(0, 0, 0, .18), inset 0 1px rgba(255, 255, 255, .04);
      font: inherit;
      font-size: 22px;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: transform .12s ease, filter .12s ease, border-color .12s ease;
    }
    .key:hover { filter: brightness(1.18); border-color: rgba(83, 196, 255, .4); }
    .key:active { transform: scale(.95); }
    .key.utility {
      color: #b9eaff;
      border-color: rgba(53, 194, 255, .2);
      background: linear-gradient(145deg, rgba(23, 77, 108, .86), rgba(14, 44, 70, .96));
    }
    .key.operator {
      color: #ffd091;
      border-color: rgba(255, 155, 39, .27);
      background: linear-gradient(145deg, rgba(105, 59, 26, .74), rgba(51, 35, 31, .96));
    }
    .key.operator.selected {
      color: #fff;
      border-color: rgba(255, 180, 85, .8);
      box-shadow: 0 0 16px rgba(255, 145, 33, .24), inset 0 0 14px rgba(255, 145, 33, .12);
    }
    .key.equals {
      color: #041629;
      border-color: rgba(126, 231, 255, .65);
      background: linear-gradient(145deg, #76eaff, #11baff 54%, #368aff);
      box-shadow: 0 0 18px rgba(0, 187, 255, .26), inset 0 1px rgba(255, 255, 255, .5);
      font-size: 27px;
      font-weight: 800;
    }
    .key.small { font-size: 17px; }
    .key:focus-visible, .back:focus-visible { outline: 2px solid white; outline-offset: 3px; }
    .hint { margin: 14px 4px 0; color: #8c9fb5; font-size: 11px; line-height: 1.5; text-align: center; }
    @media (max-width: 360px) {
      .card { padding: 15px; }
      .keys { gap: 8px; }
      .key { min-height: 56px; border-radius: 15px; }
      .display { min-height: 128px; }
    }
    @media (prefers-reduced-motion: reduce) { .key { transition: none; } }
  </style>
</head>
<body>
  <main class="app">
    <a class="back" href="./index.html"><span aria-hidden="true">←</span> Voltar ao launcher</a>

    <section class="card" aria-label="Calculadora">
      <div class="display" aria-live="polite" aria-atomic="true">
        <div class="expression" id="expression"></div>
        <div class="value" id="value">0</div>
      </div>
      <div class="keys" id="keys">
        <button class="key utility small" type="button" data-action="clear" aria-label="Limpar tudo">AC</button>
        <button class="key utility" type="button" data-action="sign" aria-label="Trocar sinal">±</button>
        <button class="key utility" type="button" data-action="percent" aria-label="Porcentagem">%</button>
        <button class="key operator" type="button" data-operator="/" aria-label="Dividir">÷</button>

        <button class="key" type="button" data-digit="7">7</button>
        <button class="key" type="button" data-digit="8">8</button>
        <button class="key" type="button" data-digit="9">9</button>
        <button class="key operator" type="button" data-operator="*" aria-label="Multiplicar">×</button>

        <button class="key" type="button" data-digit="4">4</button>
        <button class="key" type="button" data-digit="5">5</button>
        <button class="key" type="button" data-digit="6">6</button>
        <button class="key operator" type="button" data-operator="-" aria-label="Subtrair">−</button>

        <button class="key" type="button" data-digit="1">1</button>
        <button class="key" type="button" data-digit="2">2</button>
        <button class="key" type="button" data-digit="3">3</button>
        <button class="key operator" type="button" data-operator="+" aria-label="Somar">+</button>

        <button class="key utility" type="button" data-action="backspace" aria-label="Apagar último dígito">⌫</button>
        <button class="key" type="button" data-digit="0">0</button>
        <button class="key" type="button" data-action="decimal" aria-label="Vírgula decimal">,</button>
        <button class="key equals" type="button" data-action="equals" aria-label="Calcular resultado">=</button>
      </div>
    </section>
    <p class="hint">Use os botões ou o teclado. A calculadora não precisa de conexão com a internet.</p>
  </main>

  <script>
    (() => {
      'use strict';
      const valueEl = document.getElementById('value');
      const expressionEl = document.getElementById('expression');
      const keys = document.getElementById('keys');
      const operators = { '+': '+', '-': '−', '*': '×', '/': '÷' };
      const numberFormat = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 10, useGrouping: true });
      let displayValue = '0';
      let firstOperand = null;
      let pendingOperator = null;
      let waitingForNext = false;
      let repeatedOperator = null;
      let repeatedOperand = null;

      function numericValue(value = displayValue) {
        return Number(String(value).replace(',', '.'));
      }

      function formatted(value) {
        if (value === 'Erro') return value;
        const number = numericValue(value);
        if (!Number.isFinite(number)) return 'Erro';
        return numberFormat.format(number);
      }

      function render() {
        valueEl.textContent = formatted(displayValue);
        keys.querySelectorAll('[data-operator]').forEach((button) => {
          button.classList.toggle('selected', button.dataset.operator === pendingOperator && waitingForNext);
        });
      }

      function setResult(number) {
        if (!Number.isFinite(number) || Math.abs(number) > 1e15) {
          displayValue = 'Erro';
          firstOperand = null;
          pendingOperator = null;
          expressionEl.textContent = 'Não é possível calcular esse valor';
          waitingForNext = true;
          render();
          return false;
        }
        displayValue = String(Number(number.toPrecision(12)));
        render();
        return true;
      }

      function calculate(left, right, operator) {
        if (operator === '+') return left + right;
        if (operator === '-') return left - right;
        if (operator === '*') return left * right;
        if (operator === '/') return right === 0 ? null : left / right;
        return right;
      }

      function inputDigit(digit) {
        if (displayValue === 'Erro' || waitingForNext) {
          displayValue = digit;
          waitingForNext = false;
        } else if (displayValue.replace(/\D/g, '').length < 14) {
          displayValue = displayValue === '0' ? digit : displayValue + digit;
        }
        render();
      }

      function inputDecimal() {
        if (displayValue === 'Erro' || waitingForNext) {
          displayValue = '0,';
          waitingForNext = false;
        } else if (!displayValue.includes(',')) {
          displayValue += ',';
        }
        render();
      }

      function chooseOperator(operator) {
        if (displayValue === 'Erro') clearAll();
        const current = numericValue();
        if (pendingOperator && !waitingForNext) {
          const result = calculate(firstOperand, current, pendingOperator);
          if (result === null) {
            showDivisionError();
            return;
          }
          if (!setResult(result)) return;
          firstOperand = numericValue();
        } else {
          firstOperand = current;
        }
        pendingOperator = operator;
        waitingForNext = true;
        repeatedOperator = null;
        repeatedOperand = null;
        expressionEl.textContent = `${formatted(String(firstOperand))} ${operators[operator]}`;
        render();
      }

      function equals() {
        if (displayValue === 'Erro') return;
        let operator = pendingOperator;
        let left = firstOperand;
        let right = numericValue();
        if (!operator && repeatedOperator) {
          operator = repeatedOperator;
          left = numericValue();
          right = repeatedOperand;
        } else if (!operator) {
          return;
        }
        const leftText = formatted(String(left));
        const rightText = formatted(String(right));
        const result = calculate(left, right, operator);
        if (result === null) {
          showDivisionError();
          return;
        }
        repeatedOperator = operator;
        repeatedOperand = right;
        expressionEl.textContent = `${leftText} ${operators[operator]} ${rightText} =`;
        firstOperand = null;
        pendingOperator = null;
        waitingForNext = true;
        setResult(result);
      }

      function showDivisionError() {
        displayValue = 'Erro';
        firstOperand = null;
        pendingOperator = null;
        repeatedOperator = null;
        repeatedOperand = null;
        waitingForNext = true;
        expressionEl.textContent = 'Não é possível dividir por zero';
        render();
      }

      function clearAll() {
        displayValue = '0';
        firstOperand = null;
        pendingOperator = null;
        waitingForNext = false;
        repeatedOperator = null;
        repeatedOperand = null;
        expressionEl.textContent = '';
        render();
      }

      function clearEntry() {
        displayValue = '0';
        waitingForNext = false;
        render();
      }

      function toggleSign() {
        if (displayValue === 'Erro' || numericValue() === 0) return;
        displayValue = displayValue.startsWith('-') ? displayValue.slice(1) : `-${displayValue}`;
        render();
      }

      function percent() {
        if (displayValue === 'Erro') return;
        setResult(numericValue() / 100);
        waitingForNext = false;
      }

      function backspace() {
        if (displayValue === 'Erro' || waitingForNext) return;
        displayValue = displayValue.length > 1 ? displayValue.slice(0, -1) : '0';
        if (displayValue === '-' || displayValue === '-0') displayValue = '0';
        render();
      }

      function handleAction(action) {
        if (action === 'clear') clearAll();
        if (action === 'sign') toggleSign();
        if (action === 'percent') percent();
        if (action === 'decimal') inputDecimal();
        if (action === 'backspace') backspace();
        if (action === 'equals') equals();
      }

      keys.addEventListener('click', (event) => {
        const button = event.target.closest('button');
        if (!button) return;
        if (button.dataset.digit) inputDigit(button.dataset.digit);
        else if (button.dataset.operator) chooseOperator(button.dataset.operator);
        else if (button.dataset.action) handleAction(button.dataset.action);
      });

      document.addEventListener('keydown', (event) => {
        if (/^[0-9]$/.test(event.key)) inputDigit(event.key);
        else if (event.key === ',' || event.key === '.') inputDecimal();
        else if (['+', '-', '*', '/'].includes(event.key)) chooseOperator(event.key);
        else if (event.key === 'Enter' || event.key === '=') { event.preventDefault(); equals(); }
        else if (event.key === 'Backspace') backspace();
        else if (event.key === 'Escape') clearAll();
        else if (event.key === '%') percent();
      });

      render();
    })();
  </script>
</body>
</html>
